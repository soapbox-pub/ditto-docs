<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171"/>
      <stop offset="25%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#34d399"/>
      <stop offset="75%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Outer rainbow ring -->
  <circle cx="50" cy="50" r="45" fill="url(#rainbow)"/>
  <!-- White inner -->
  <circle cx="50" cy="50" r="32" fill="#fefce8"/>
  <!-- Warm iris -->
  <circle cx="50" cy="50" r="20" fill="#f59e0b"/>
  <!-- Pupil -->
  <circle cx="50" cy="50" r="10" fill="#1c1917"/>
  <!-- Highlight -->
  <circle cx="44" cy="44" r="4" fill="white" opacity="0.8"/>
</svg>
