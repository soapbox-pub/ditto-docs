image: oven/bun:1

default:
  interruptible: true

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/

before_script:
  - bun install --frozen-lockfile

# GitLab is a mirror of the nostr repo and only builds here; about.ditto.pub is
# published as an nsite by .ngit/act/workflows/deploy-nsite.yml, which runs on
# the ngit-ci coordinator. Nothing is rsynced to venus any more, so this runs
# on every branch rather than standing aside for a deploy job on the default
# one.
build:
  script:
    - bun run build
