image: oven/bun:1

default:
  interruptible: true

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/

before_script:
  - bun install --frozen-lockfile

build:
  script:
    - bun run build
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

deploy:
  script:
    - bun run build
    - apt-get update -qq && apt-get install -y --no-install-recommends rsync openssh-client >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "${DEPLOY_TARGET##*@}" >> ~/.ssh/known_hosts 2>/dev/null
    - rsync -av --exclude=sw.js --exclude=index.html -e "ssh -i ~/.ssh/id_ed25519" .vitepress/dist/ "${DEPLOY_TARGET}:/"
    - rsync -av -e "ssh -i ~/.ssh/id_ed25519" .vitepress/dist/index.html "${DEPLOY_TARGET}:/"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_SSH_KEY && $DEPLOY_TARGET
