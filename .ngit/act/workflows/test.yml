name: Test

# VitePress has no unit tests here, so the build IS the test: it resolves every
# internal link and fails on a dead one. ngit-ci watches
# .ngit/act/workflows/ and runs each job with `act` (GitHub Actions-compatible
# syntax) in a Linux container. Runs on every push and on every Nostr PR.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build
